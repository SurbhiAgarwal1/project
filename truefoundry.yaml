name: opsara-incident-response
type: service
image:
  build:
    type: dockerfile
    dockerfilePath: Dockerfile
    buildContextPath: .
port: 8000
env:
  ENVIRONMENT: production
  USE_SQLITE: "true"
  DATABASE_URL: sqlite+aiosqlite:///./opsara.db
  DEFAULT_NAMESPACE: opsara-demo
  CLUSTER_NAME: truefoundry-cluster
resources:
  cpu_request: 0.5
  cpu_limit: 1.0
  memory_request: 512Mi
  memory_limit: 1Gi
replicas:
  min: 1
  max: 1
health_checks:
  liveness_probe:
    path: /healthz
    port: 8000
    initial_delay_seconds: 15
    period_seconds: 10
  readiness_probe:
    path: /healthz
    port: 8000
    initial_delay_seconds: 10
    period_seconds: 5
